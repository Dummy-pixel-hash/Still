# Still release: analyze + test, Android APK/AAB, Windows x64 + ARM64.
# Flutter is pinned to the version this project was built with (3.24.5),
# except the Windows ARM64 job, which uses a stable that ships the native
# Windows ARM64 Dart SDK/engine (3.44+). No signing secrets: Android
# release artifacts use the template debug signing until real release
# credentials are configured at handoff.
name: Still release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_VERSION_ARM64: "3.44.9"

jobs:
  check:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter analyze
      - run: flutter test

  android:
    name: android APK + AAB
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: still-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: still-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  windows-x64:
    name: windows x64
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath still-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: still-windows-x64
          path: still-windows-x64.zip

  windows-arm64:
    name: windows ARM64
    runs-on: windows-11-vs2026-arm
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION_ARM64 }}
          channel: stable
          cache: true
      # 3.24.5 cannot target ARM64 with a native toolchain; 3.44+ ships
      # the native Windows ARM64 Dart SDK/engine. On this ARM64 host,
      # Flutter targets windows-arm64 natively:
      # build\windows\arm64\runner\Release.
      - run: flutter build windows --release
      - name: verify ARM64 binary
        shell: pwsh
        run: |
          $exe = "build\windows\arm64\runner\Release\still.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToUInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0xaa64) { throw "expected ARM64 (0xaa64), got 0x$($machine.ToString('x4'))" }
      - run: Compress-Archive -Path build\windows\arm64\runner\Release\* -DestinationPath still-windows-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: still-windows-arm64
          path: still-windows-arm64.zip
